<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grades</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header>
        <h3 id="gradeHeader">My Grades</h3>
        <select id="themeSelect" aria-label="Select Theme">
            <option value="minimal">Minimalism</option>
            <option value="macos">macOS</option>
            <option value="terminal">Retro Terminal</option>
            <option value="brutalism">Neo-Brutalism</option>
        </select>
    </header>

    <div class="card">
        <div id="noDataMessage"
            style="display: none; padding: 2rem 1rem; text-align: center; color: hsl(var(--muted-foreground));">
            No data found. Please navigate to the grades section in the portal and refresh the grades page.
        </div>
        <table id="gradeTable">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Units</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <!-- // -->
            </tbody>
        </table>
    </div>

    <script src="popup.js"></script>
</body>

</html>
